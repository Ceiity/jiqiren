# 奶龙云盘 — bundled nginx: static SPA + streaming reverse proxy to the API container.

# keep the scheme an outer HTTPS proxy reported, otherwise use ours
map $http_x_forwarded_proto $nl_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $nl_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # upload chunks are ≤ 64 MB (MAX_CHUNK_MB); leave headroom
    client_max_body_size 80m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nl_forwarded_proto;
        proxy_set_header X-Forwarded-Host $nl_forwarded_host;
        proxy_set_header Connection "";

        # stream uploads and downloads straight through — no buffering, no temp files
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        send_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
