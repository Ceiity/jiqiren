<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EFF0F3" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>奶龙云盘</title>
    <script>
      // paint the remembered page colour before React boots — no white flash in dark mode
      try {
        var t = JSON.parse(localStorage.getItem('nl_boot_theme') || 'null');
        if (t) {
          document.documentElement.dataset.theme = t.dark ? 'dark' : 'light';
          document.documentElement.style.setProperty('--page', t.page);
          document.documentElement.style.setProperty('--on-surface', t.fg);
          document.documentElement.style.background = t.page;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
